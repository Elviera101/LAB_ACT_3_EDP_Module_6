
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Seminar Registration</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="logo">IT</div>
            <h1>IT Seminar Registration</h1>
            <p>Register now and be part of our upcoming seminar!</p>
        </div>

        <form id="registrationForm" novalidate>

            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" name="fullName"
                    placeholder="Enter your full name"
                    aria-describedby="fullNameError">
                <small class="error" id="fullNameError"></small>
            </div>

            <div class="form-group">
                <label for="studentNumber">Student Number</label>
                <input type="text" id="studentNumber" name="studentNumber"
                    placeholder="24-1234-123"
                    aria-describedby="studentNumberError">
                <small class="error" id="studentNumberError"></small>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email"
                    placeholder="example@email.com"
                    aria-describedby="emailError">
                <small class="error" id="emailError"></small>
            </div>

            <div class="form-group">
                <label for="mobileNumber">Mobile Number</label>
                <input type="tel" id="mobileNumber" name="mobileNumber"
                    placeholder="09XXXXXXXXX"
                    aria-describedby="mobileError">
                <small class="error" id="mobileError"></small>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password"
                    placeholder="Create a password"
                    aria-describedby="passwordError passwordFeedback">
                <small class="error" id="passwordError"></small>
                <small class="feedback" id="passwordFeedback"></small>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword"
                    name="confirmPassword"
                    placeholder="Confirm your password"
                    aria-describedby="confirmPasswordError">
                <small class="error" id="confirmPasswordError"></small>
            </div>

            <div class="form-group">
                <label for="course">Course</label>
                <select id="course" name="course"
                    aria-describedby="courseError">
                    <option value="">Select your course</option>
                    <option value="BSIT">BSIT</option>
                    <option value="BSCS">BSCS</option>
                </select>
                <small class="error" id="courseError"></small>
            </div>

            <div class="terms-group">
                <input type="checkbox" id="terms" name="terms"
                    aria-describedby="termsError">
                <label for="terms">
                    I agree to the terms and conditions.
                </label>
            </div>
            <small class="error terms-error" id="termsError"></small>

            <div class="buttons">
                <button type="submit" id="registerBtn">
                    Register
                </button>
                <button type="reset" id="resetBtn">
                    Reset
                </button>
            </div>

        </form>

        <div id="successMessage" class="success-message"
            role="status" aria-live="polite"></div>

        <div id="registrationSummary" class="summary" hidden>
            <h2>Registration Summary</h2>
            <div class="summary-item">
                <span>Full Name:</span>
                <span id="summaryName"></span>
            </div>
            <div class="summary-item">
                <span>Student Number:</span>
                <span id="summaryStudentNumber"></span>
            </div>
            <div class="summary-item">
                <span>Email:</span>
                <span id="summaryEmail"></span>
            </div>
            <div class="summary-item">
                <span>Mobile Number:</span>
                <span id="summaryMobileNumber"></span>
            </div>
            <div class="summary-item">
                <span>Course:</span>
                <span id="summaryCourse"></span>
            </div>
        </div>

        <footer>
            <p>IT Seminar Registration System</p>
        </footer>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
